}

}

}

    <!-- Inject dynamic text-along-path plugin logic directly -->
    <script>
    L.Polyline.include({
        setText: function (text, options) {
            options = options || {};
            if (!text) {
                if (this._textNode && this._textNode.parentNode) {
                    this._textNode.parentNode.removeChild(this._textNode);
                }
                return this;
            }
            var defaults = {
                center: true,
                below: false,
                offset: 0,
                orientation: 0,
                attributes: {}
            };
            for (var i in defaults) { if (options[i] === undefined) { options[i] = defaults[i]; } }
            
            this._text = text;
            this._textOptions = options;
            
            this.on('add', this._setText, this);
            this.on('remove', this._clearText, this);
            
            if (this._map) { this._setText(); }
            return this;
        },
        _clearText: function () {
            if (this._textNode && this._textNode.parentNode) {
                this._textNode.parentNode.removeChild(this._textNode);
            }
        },
        _setText: function () {
            if (!this._renderer || !this._renderer._container) return;
            var path = this._path;
            if (!path) return;
            
            var id = 'path-' + L.Util.stamp(this);
            path.setAttribute('id', id);
            
            var svg = this._map._renderer._container;
            if (svg.tagName !== 'svg') {
                svg = svg.querySelector('svg');
            }
            if (!svg) return;
            
            var defs = svg.querySelector('defs');
            if (!defs) {
                defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                svg.insertBefore(defs, svg.firstChild);
            }
            
            this._clearText();
            
            var textNode = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            var textPath = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
            
            textPath.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + id);
            if (this._textOptions.center) {
                textPath.setAttribute('startOffset', '50%');
                textNode.setAttribute('text-anchor', 'middle');
            }
            
            textPath.textContent = this._text;
            textNode.appendChild(textPath);
            
            for (var attr in this._textOptions.attributes) {
                textNode.setAttribute(attr, this._textOptions.attributes[attr]);
            }
            
            if (this._textOptions.offset !== 0) {
                textNode.setAttribute('dy', this._textOptions.offset);
            }
            
            svg.appendChild(textNode);
            this._textNode = textNode;
        }
    });
    </script>

    <!-- Main Interactive Map Script -->
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        const mapContainer = document.getElementById('map');
        if (!mapContainer) return;

        // Use preferCanvas: false to allow SVG manipulation for path texts
        const map = L.map('map', { preferCanvas: false }).setView([13.733589, 100.565204], 15);

     /* Dark_all to Dark_nolabels after weird update made everything look crap */
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}{r}.png?key=cb1_2hjm_1_56adebf3899dfbc5f7431626', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);

        setTimeout(() => {
            map.invalidateSize();
        }, 200);

      // ==========================================================================
        // INJECT NAV BUTTONS DIRECTLY OVER MAP
        // ==========================================================================
        const navControlDiv = document.createElement('div');
        navControlDiv.className = 'map-nav-container';
        mapContainer.appendChild(navControlDiv);

        // Location menu with city, Bangkok district, and Pattaya area levels. Controls crossfade in place.
        let navLevel = 'cities';
        let navTransitioning = false;
        const navFadeDuration = 1000; // 1s out + 1s in = 2s total

        function renderLocationButtons(level) {
            navLevel = level;
            if (level === 'cities') {
                navControlDiv.innerHTML = `
                    <button id="nav-bangkok" class="nav-btn btn-bangkok">📍 Bangkok</button>
                    <button id="nav-pattaya" class="nav-btn btn-pattaya">📍 Pattaya</button>
                    <button id="nav-phuket" class="nav-btn btn-phuket">📍 Phuket</button>
                `;
                document.getElementById('nav-bangkok').addEventListener('click', function() {
                    changeLocationMenu('districts');
                    map.flyTo([13.733589, 100.565204], 12, { duration: 1.5 });
                });
                document.getElementById('nav-pattaya').addEventListener('click', function() {
                    changeLocationMenu('pattaya');
                    map.flyTo([12.9236, 100.8825], 13, { duration: 1.5 });
                });
                document.getElementById('nav-phuket').addEventListener('click', function() {
                    map.flyTo([7.8804, 98.3923], 12, { duration: 1.5 });
                });
            } else if (level === 'pattaya') {
                navControlDiv.innerHTML = `
                    <button id="nav-walking-street" class="nav-btn btn-patpong">📍 Walking Street</button>
                    <button id="nav-buakhao" class="nav-btn btn-sukhumvit">📍 Soi Buakhao</button>
                    <button id="nav-soi6" class="nav-btn btn-huaikhwang">📍 Soi 6</button>
                    <button id="nav-back" class="nav-btn btn-back" aria-label="Back to city selection" title="Back to cities">▲</button>
                `;
                document.getElementById('nav-walking-street').addEventListener('click', function() {
                    map.flyTo([12.92545, 100.871225], 16, { duration: 1.5 });
                });
                document.getElementById('nav-buakhao').addEventListener('click', function() {
                    map.flyTo([12.9289, 100.8849], 16, { duration: 1.5 });
                });
                document.getElementById('nav-soi6').addEventListener('click', function() {
                    map.flyTo([12.9492, 100.8872], 16, { duration: 1.5 });
                });
                document.getElementById('nav-back').addEventListener('click', function() {
                    changeLocationMenu('cities');
                });
            } else {
                navControlDiv.innerHTML = `
                    <button id="nav-sukhumvit" class="nav-btn btn-sukhumvit">📍 Sukhumvit</button>
                    <button id="nav-patpong" class="nav-btn btn-patpong">📍 Patpong</button>
                    <button id="nav-huaikhwang" class="nav-btn btn-huaikhwang">📍 Huai Khwang</button>
                    <button id="nav-back" class="nav-btn btn-back" aria-label="Back to city selection" title="Back to cities">▲</button>
                `;
                document.getElementById('nav-sukhumvit').addEventListener('click', function() {
                    map.flyTo([13.733589, 100.565204], 15, { duration: 1.5 });
                });
                document.getElementById('nav-patpong').addEventListener('click', function() {
                    map.flyTo([13.7284, 100.5280], 15, { duration: 1.5 });
                });
                document.getElementById('nav-huaikhwang').addEventListener('click', function() {
                    map.flyTo([13.7766, 100.5744], 14, { duration: 1.5 });
                });
                document.getElementById('nav-back').addEventListener('click', function() {
                    changeLocationMenu('cities');
                });
            }
        }

        function changeLocationMenu(nextLevel) {
            if (navTransitioning || nextLevel === navLevel) return;
            navTransitioning = true;
            navControlDiv.classList.add('nav-fading');
            window.setTimeout(function() {
                renderLocationButtons(nextLevel);
                // Force the browser to apply the faded state before fading the new buttons in.
                void navControlDiv.offsetWidth;
                navControlDiv.classList.remove('nav-fading');
                window.setTimeout(function() { navTransitioning = false; }, navFadeDuration);
            }, navFadeDuration);
        }

        renderLocationButtons('cities');

        // ==========================================================================
        // BUSINESS CATEGORY FILTERS
        // ==========================================================================
        const filterControlDiv = document.createElement('div');
        filterControlDiv.className = 'map-filter-container';
        filterControlDiv.innerHTML = `
            <button class="filter-btn active" data-filter="all">All Businesses</button>
            <button class="filter-btn" data-filter="massage">Massage &amp; Men's Esthe</button>
            <button class="filter-btn" data-filter="short-time-pink">Short-time Bars &amp; Pink Salons</button>
            <button class="filter-btn" data-filter="agogo">Agogo &amp; Beer Bars</button>
            <button class="filter-btn" data-filter="karaoke-gclubs">Karaoke &amp; G-Clubs</button>
            <button class="filter-btn" data-filter="beer-live-music">Beer &amp; Live Music Bars</button>
        `;
        mapContainer.appendChild(filterControlDiv);

        let activeBusinessFilter = 'all';

        function getBusinessFilterCategory(loc) {
            // An explicit filterCategory on a location always takes priority.
            if (loc.filterCategory) {
                const explicit = loc.filterCategory.toLowerCase();
                if (explicit === 'karaoke' || explicit === 'gentlemens-clubs' || explicit === 'g-clubs') return 'karaoke-gclubs';
                return explicit;
            }
            const categoryText = (loc.category || '').toLowerCase();
            const businessText = ((loc.name || '') + ' ' + (loc.text || '')).toLowerCase();
            const allText = categoryText + ' ' + businessText;

            // Check specific venue types before broader categories to avoid false matches.
            if (/short[ -]?time|pink salon|pink salons/.test(allText)) return 'short-time-pink';
            if (/a[ -]?go[ -]?go|agogo|gogo bar|go-go bar/.test(allText)) return 'agogo';
            if (/karaoke|gentlemen.?s club|gentleman.?s club|men.?s club|g[ -]?clubs?/.test(allText)) return 'karaoke-gclubs';
            if (/beer|live music|brewery|taproom/.test(allText)) return 'beer-live-music';
            if (/wellness|massage|men.?s esthe|esthe|spa/.test(allText)) return 'massage';
            return 'other';
        }

        function applyBusinessFilter(filter) {
            activeBusinessFilter = filter;
            const fadeDuration = 1000;

            locations.forEach(loc => {
                const marker = loc.marker;
                if (!marker) return;
                const matches = filter === 'all' || getBusinessFilterCategory(loc) === filter;

                // Cancel any pending removal if the user changes filters again quickly.
                if (loc._filterFadeTimer) {
                    clearTimeout(loc._filterFadeTimer);
                    loc._filterFadeTimer = null;
                }

                const icon = marker.getElement ? marker.getElement() : marker._icon;
                if (matches) {
                    if (!map.hasLayer(marker)) {
                        // Add it hidden, then let the browser animate it to full opacity.
                        marker.setOpacity(0);
                        marker.addTo(map);
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                if (map.hasLayer(marker)) marker.setOpacity(1);
                            });
                        });
                    } else {
                        marker.setOpacity(1);
                    }
                } else if (map.hasLayer(marker)) {
                    marker.setOpacity(0);
                    loc._filterFadeTimer = setTimeout(() => {
                        const stillMatches = activeBusinessFilter === 'all' ||
                            getBusinessFilterCategory(loc) === activeBusinessFilter;
                        if (!stillMatches && map.hasLayer(marker)) {
                            map.removeLayer(marker);
                        }
                        loc._filterFadeTimer = null;
                    }, fadeDuration);
                }
            });

            filterControlDiv.querySelectorAll('.filter-btn').forEach(button => {
                const isActive = button.dataset.filter === filter;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
        }

        filterControlDiv.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', function() {
                applyBusinessFilter(this.dataset.filter);
            });
        });

        // ==========================================================================
        // MAIN ROAD: RATCHADAPHISEK
        // ==========================================================================
        const ratchadaPath = [
            [13.763809, 100.568371],
            [13.769090, 100.572520],
            [13.770003, 100.573001],
            [13.771673, 100.573343],
            [13.789063, 100.574164]
        ];

        const ratchadaLine = L.polyline(ratchadaPath, {
            color: '#ff0077',
            weight: 6,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        const ratchadaGlow = L.polyline(ratchadaPath, {
            color: '#ff00ff',
            weight: 12,
            opacity: 0.3,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        ratchadaLine.setText("RATCHADAPHISEK RD", {
            center: true,
            offset: -8,
            attributes: {
                'fill': '#00ffff',
                'font-weight': 'bold',
                'font-size': '12px',
                'font-family': 'Helvetica Neue, Arial, sans-serif',
                'letter-spacing': '2px',
                'filter': 'drop-shadow(0px 0px 3px #00ffff)'
            }
        });

        const ratchadaData = {
            name: "Ratchadaphisek Rd",
            category: "🛣️ Main Entertainment Artery",
            text: "A major road in Bangkok serving as another massive hub for nightlife, massive entertainment complexes, and dining.",
            google: "https://www.google.com/maps/search/?api=1&query=13.7766,100.5744" 
        };

        ratchadaLine.on('click', () => showPanel(ratchadaData));
        
        // ==========================================================================
        // MAIN ROAD: SUKHUMVIT (With Text Bending Along Path)
        // ==========================================================================
        const sukhumvitCurvedPath = [
            [13.742141, 100.552958],
            [13.741508, 100.554086],
            [13.740972, 100.554843],
            [13.736409, 100.561280],
            [13.729050, 100.571708],
        ];

        const roadLine = L.polyline(sukhumvitCurvedPath, {
            color: '#ff0077',
            weight: 6,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        const roadGlow = L.polyline(sukhumvitCurvedPath, {
            color: '#ff00ff',
            weight: 12,
            opacity: 0.3,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        // Bends neon cyber-styled label over the Sukhumvit polyline
        roadLine.setText("SUKHUMVIT ROAD", {
            center: true,
            offset: -8,
            attributes: {
                'fill': '#00ffff',
                'font-weight': 'bold',
                'font-size': '12px',
                'font-family': 'Helvetica Neue, Arial, sans-serif',
                'letter-spacing': '2px',
                'filter': 'drop-shadow(0px 0px 3px #00ffff)'
            }
        });

        const sukhumvitData = {
            name: "Sukhumvit Road",
            category: "🛣️ Main Entertainment Artery",
            text: "One of Thailand's longest roads, serving as the absolute central hub for Bangkok's premier nightlife, dining, shopping, and neon-drenched side-sois.",
            google: "https://www.google.com/maps/search/?api=1&query=13.736535,100.561377"
        };

        roadLine.on('click', () => showPanel(sukhumvitData));

        // ==========================================================================
        // MINOR ROAD: RCA Alley
        // ==========================================================================
        const RCAAlleyPath = [
            [13.750028, 100.576684],
            [13.750391, 100.576344],
            [13.751279, 100.575616],
            [13.753011, 100.574470],
            [13.755450, 100.573389],
            [13.756677, 100.573010],
            [13.758818, 100.572619],
            [13.760294, 100.572528],
            [13.764666, 100.572722],
            [13.767507, 100.572862],
            [13.769023, 100.573185],
            [13.769607, 100.572803]

        ];

        const RCAAlley = L.polyline(RCAAlleyPath, {
            color: '#aaaaaa',
            weight: 4,
            opacity: 0.75,
            lineCap: 'round',
            lineJoin: 'round',
            interactive: false
        }).addTo(map);

        RCAAlley.setText("RCA Alley", {
            center: true,
            offset: -6,
            attributes: {

        window.showPanel = function(loc) {
            const panelContent = document.getElementById('panel-content');
            if (!panelContent) return;
            
            if (loc.isCustomPanel) {
                panelContent.innerHTML = loc.htmlContent;
            } else {
                panelContent.innerHTML = `
                    <h2 style="color:#e600ff; margin-top:0;">${loc.name}</h2>
                    <p style="color:#00ffff; font-size:1.1em;">${loc.category}</p>
                    <p>${loc.text}</p>
                    <a href="${loc.google}" target="_blank" style="color:#00ffff; font-weight:bold; text-decoration:none;">→ Open in Google Maps</a>
                `;
            }
            const panel = document.getElementById('side-panel');
            if (panel) panel.classList.add('open');
        };

        const closeBtn = document.querySelector('.close-btn');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                const panel = document.getElementById('side-panel');
                if (panel) panel.classList.remove('open');
            });
        }

        locations.forEach(loc => {
            // Keep a marker reference so category buttons can show/hide it.
            loc.marker = L.marker([loc.lat, loc.lng], { icon: loc.icon })
                .addTo(map)
                .on('click', () => showPanel(loc));
        });

        // Start with all businesses visible.
        applyBusinessFilter('all');
    });
